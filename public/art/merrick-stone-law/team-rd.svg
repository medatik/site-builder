<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(16 0.5 0.5)">
      <stop offset="0" stop-color="#8A2733"/>
      <stop offset="1" stop-color="#1B2A4A"/>
    </linearGradient>
  </defs>
  <!-- No background rect on purpose. These are drawn from colorsLight, so
       painting the light background here put a cream tile on every card of a
       DARK-mode page. Transparent, the monogram sits on whatever surface
       renders it and both modes look deliberate. -->
  <circle cx="200" cy="200" r="176" fill="url(#g)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#A77F39" stroke-opacity="0.5" stroke-width="4"/>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-size="120"
        font-weight="700" fill="#F4F1E9" letter-spacing="4.8">RD</text>
</svg>
